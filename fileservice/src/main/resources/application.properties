spring.application.name=fileservice
server.port=${SERVER_PORT:8080}

# MinIO Configuration
minio.endpoint=${MINIO_ENDPOINT:minio-storage}
minio.port=${MINIO_PORT:9000}
minio.access-key=${MINIO_ACCESS_KEY:admin}
minio.secret-key=${MINIO_SECRET_KEY:admin1234}
minio.bucket-name=${MINIO_BUCKET_NAME:fashionconstruct}
minio.secure=${MINIO_SECURE:false}
minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000}
minio.init.retry-count=3
minio.init.retry-delay=5000

# File Upload Configuration
file.max-size=10485760
file.allowed-extensions=.jpg,.jpeg,.png,.gif,.webp,.pdf,.doc,.docx
file.thumbnail.width=200
file.thumbnail.height=200

# Spring Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Actuator configuration
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true

# Logging
logging.level.com.example.fileservice=DEBUG
